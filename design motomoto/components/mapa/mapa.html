<!-- MAPA -->
<div class="mp" id="mp" hidden>
  <div class="mp-sheet" role="dialog" aria-modal="true" aria-label="Mapa de locales">
    <div class="mp-top"><div><b>Locales en el mapa</b><small>Toca el mapa para marcar dónde entregamos</small></div>
      <button class="mp-close" id="mpClose" type="button" aria-label="Cerrar mapa">✕</button></div>
    <div class="mp-chips" id="mpChips"></div>
    <div class="mp-body">
      <div class="mp-map" id="mpMap"></div>
      <div class="mp-msg" id="mpMsg">Cargando mapa…</div>
      <button class="mp-loc" id="mpLoc" type="button">📍 Mi ubicación</button>
      <div class="mp-list" id="mpList"></div>
    </div>
    <div class="mp-foot"><span id="mpAddr">Aún no marcas tu ubicación</span><button id="mpOk" type="button" disabled>Confirmar entrega</button></div>
  </div>
</div>
